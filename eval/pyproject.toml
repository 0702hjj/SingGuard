[project]
name = "singguard-eval"
version = "0.1.0"
description = "Reproduction harness for Table 4 (multimodal safety benchmarks, F1) of the SingGuard technical report"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # light deps: enough for data prep / aggregation on any machine
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.30",
    "pillow>=10.0",
    "tqdm>=4.66",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# heavy deps for the GPU server only:  uv sync --extra gpu
gpu = [
    "torch>=2.6",
    "torchvision",
    "transformers>=4.57",
    "accelerate>=1.4",
    "vllm>=0.11",
    "openai>=1.60",
    "modelscope>=1.20",
]

[tool.uv]
# 国内服务器如需走镜像源，取消下面注释（或 export UV_DEFAULT_INDEX）
# [[tool.uv.index]]
# url = "https://pypi.tuna.tsinghua.edu.cn/simple"
# default = true
