# Dataset registry for Table 4 reproduction (8 columns).
#
# Fields:
#   hf_id    : HuggingFace dataset repo (downloaded through HF_ENDPOINT=https://hf-mirror.com)
#   loader   : normalization function in scripts/prepare_data.py
#   sample   : per-dataset sample cap (fixed seed, stratified by label)
#   verified : false = loader written from the dataset's public schema without local download;
#              ALWAYS run `uv run python scripts/inspect_data.py <key>` on the server after
#              downloading and before trusting the numbers; loaders raise loud errors on
#              schema mismatch instead of guessing.

defaults: &defaults
  sample: 1000
  seed: 42
  verified: false

vlguard:
  <<: *defaults
  label: VLGuard
  hf_id: ys-zong/VLGuard
  loader: vlguard

jailbreakv:
  <<: *defaults
  label: JailBreakV
  hf_id: JailbreakV-28k/JailBreakV-28K
  loader: jailbreakv

spa-vl:
  <<: *defaults
  label: SPA-VL
  hf_id: sqrti/SPA-VL
  allow_patterns: ["test/*"]        # skip the 1.3GB train.zip; test/ has harm-*.parquet (unsafe) + help-*.parquet (safe)
  loader: spavl

vlsbench:
  <<: *defaults
  label: VLSBench
  hf_id: Foreshhh/vlsbench
  allow_patterns: ["data/*"]        # parquet version with embedded images; skip imgs.tar duplicate
  loader: vlsbench

mm-safety:
  <<: *defaults
  label: MM-Safety
  hf_id: PKU-Alignment/MM-SafetyBench
  loader: mmsafety

beavertails-v:
  <<: *defaults
  label: BeaverTails-V
  hf_id: PKU-Alignment/BeaverTails-V
  loader: beavertailsv

# MMDS (Huang et al. 2025): hf dataset leost233/MMDS. Per-role ratings split into
# MMDS-Q (user side) and MMDS-R (assistant side). The corpus carries an official `set`
# field (train 4045 / val 109 / test 330) and the paper scores the test split, so these
# keys filter to it: 330 rows for Q, 327 for R, no sampling (see the loader note below).
mmds-q:
  <<: *defaults
  label: MMDS-Q
  hf_id: leost233/MMDS
  loader: mmds
  split: test
  mmds_side: q
  mmds_variant: flat
  id_prefix: mmdsqt

mmds-r:
  <<: *defaults
  label: MMDS-R
  hf_id: leost233/MMDS
  loader: mmds
  split: test
  mmds_side: r
  mmds_variant: flat
  id_prefix: mmdsrt

# Side-aware assembly (Q judges the user turns alone; R judges all assistant turns given
# the user turns). Tested as an alternative reading of the per-role ratings; the paper's
# numbers sit closer to the flat form above, so these are A/B keys, not the scored columns.
mmds-q2:
  <<: *defaults
  label: MMDS-Q2
  hf_id: leost233/MMDS
  loader: mmds
  split: test
  mmds_side: q
  mmds_variant: side
  id_prefix: mmdsqt2

mmds-r2:
  <<: *defaults
  label: MMDS-R2
  hf_id: leost233/MMDS
  loader: mmds
  split: test
  mmds_side: r
  mmds_variant: side
  id_prefix: mmdsrt2

# A/B archive, superseded and NOT part of the table: the same corpus with no split filter
# (1,000-row stratified sample of all 4,484 dialogues, ~93% train). This is what produced
# the spurious ~0.77 MMDS cells; kept runnable so the protocol study reproduces.
# Frozen runs live in results/preds/*__mmds-{q,r}{,-int,2,2-int}-pool.jsonl.
mmds-q-pool:
  <<: *defaults
  label: MMDS-Q-pool
  hf_id: leost233/MMDS
  loader: mmds
  mmds_side: q
  mmds_variant: flat
  id_prefix: mmdsq

mmds-r-pool:
  <<: *defaults
  label: MMDS-R-pool
  hf_id: leost233/MMDS
  loader: mmds
  mmds_side: r
  mmds_variant: flat
  id_prefix: mmdsr

mmds-q-pool-int:
  <<: *defaults
  label: MMDS-Q-pool-int
  hf_id: leost233/MMDS
  loader: mmds
  mmds_side: q
  mmds_variant: flat-int
  id_prefix: mmdsq

mmds-r-pool-int:
  <<: *defaults
  label: MMDS-R-pool-int
  hf_id: leost233/MMDS
  loader: mmds
  mmds_side: r
  mmds_variant: flat-int
  id_prefix: mmdsr

mmds-q-pool2:
  <<: *defaults
  label: MMDS-Q-pool2
  hf_id: leost233/MMDS
  loader: mmds
  mmds_side: q
  mmds_variant: side
  id_prefix: mmdsq

mmds-r-pool2:
  <<: *defaults
  label: MMDS-R-pool2
  hf_id: leost233/MMDS
  loader: mmds
  mmds_side: r
  mmds_variant: side
  id_prefix: mmdsr
