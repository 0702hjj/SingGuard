# Dataset registry for Table 4 reproduction (8 columns).
#
# Fields:
#   hf_id    : HuggingFace dataset repo (downloaded through HF_ENDPOINT=https://hf-mirror.com)
#   loader   : normalization function in scripts/prepare_data.py
#   sample   : per-dataset sample cap (fixed seed, stratified by label)
#   verified : false = loader written from the dataset's public schema without local download;
#              ALWAYS run `uv run python scripts/inspect_data.py <key>` on the server after
#              downloading and before trusting the numbers; loaders raise loud errors on
#              schema mismatch instead of guessing.

defaults: &defaults
  sample: 1000
  seed: 42
  verified: false

vlguard:
  <<: *defaults
  label: VLGuard
  hf_id: ys-zong/VLGuard
  loader: vlguard

jailbreakv:
  <<: *defaults
  label: JailBreakV
  hf_id: JailbreakV-28k/JailBreakV-28K
  loader: jailbreakv

spa-vl:
  <<: *defaults
  label: SPA-VL
  hf_id: sqrti/SPA-VL
  allow_patterns: ["test/*"]        # skip the 1.3GB train.zip; test/ has harm-*.parquet (unsafe) + help-*.parquet (safe)
  loader: spavl

vlsbench:
  <<: *defaults
  label: VLSBench
  hf_id: Foreshhh/vlsbench
  allow_patterns: ["data/*"]        # parquet version with embedded images; skip imgs.tar duplicate
  loader: vlsbench

mm-safety:
  <<: *defaults
  label: MM-Safety
  hf_id: PKU-Alignment/MM-SafetyBench
  loader: mmsafety

beavertails-v:
  <<: *defaults
  label: BeaverTails-V
  hf_id: PKU-Alignment/BeaverTails-V
  loader: beavertailsv

# MMDS (Huang et al. 2025) is public since 2026-03: hf dataset leost233/MMDS
# (mmds.jsonl + images.zip). Per-role ratings split into MMDS-Q (user side) and
# MMDS-R (assistant side); the loader emits both test sets from one run.
mmds-q:
  <<: *defaults
  label: MMDS-Q
  hf_id: leost233/MMDS
  loader: mmds

mmds-r:
  <<: *defaults
  label: MMDS-R
  hf_id: leost233/MMDS
  loader: mmds
