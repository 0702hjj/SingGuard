# Model registry for Table 4 reproduction.
#
# Fields:
#   label               : row name in the reproduced table (aligned with configs/table4_paper.csv)
#   adapter             : prompt/parse strategy, see sgeval/adapters.py
#   engine              : vllm (default) or hf (transformers fallback)
#   ms_id / hf_id       : ModelScope id (CN direct) / HuggingFace id (via hf-mirror)
#   path                : local dir populated by scripts/download_models.py (relative to eval/)
#   gen                 : decoding args (greedy everywhere, matching the paper's protocol)
#   chat_template_kwargs: passed through vLLM `chat_template_kwargs` into apply_chat_template
#   max_model_len       : vLLM context length
#
# Baseline prompts are approximations: the paper does not release the exact prompts used for
# baseline rows (Appendix A only documents SingGuard's template). Each adapter follows the
# corresponding model card as closely as practical.

defaults: &defaults
  engine: vllm
  gpu_memory_utilization: 0.90
  gen: {temperature: 0.0}

# ---------------------------------------------------------------- enabled set
sing-guard-2b:
  <<: *defaults
  label: SingGuard-2B
  adapter: singguard
  ms_id: inclusionAI/Sing-Guard-2b
  hf_id: inclusionAI/Sing-Guard-2b
  path: models/sing-guard-2b
  max_model_len: 32768
  gen: {temperature: 0.0, max_tokens: 1024}
  chat_template_kwargs: {thinking_type: fast}   # paper Sec 2.6: fast judgment is used for high-throughput benchmark evaluation; empirically reproduces Table 4 (8B VLGuard 0.9536 vs paper 0.9511)

sing-guard-4b:
  <<: *defaults
  label: SingGuard-4B
  adapter: singguard
  ms_id: inclusionAI/Sing-Guard-4b
  hf_id: inclusionAI/Sing-Guard-4b
  path: models/sing-guard-4b
  max_model_len: 32768
  gen: {temperature: 0.0, max_tokens: 1024}
  chat_template_kwargs: {thinking_type: fast}   # paper Sec 2.6: fast judgment is used for high-throughput benchmark evaluation; empirically reproduces Table 4 (8B VLGuard 0.9536 vs paper 0.9511)

sing-guard-8b:
  <<: *defaults
  label: SingGuard-8B
  adapter: singguard
  ms_id: inclusionAI/Sing-Guard-8b
  hf_id: inclusionAI/Sing-Guard-8b
  path: models/sing-guard-8b
  max_model_len: 32768
  gen: {temperature: 0.0, max_tokens: 1024}
  chat_template_kwargs: {thinking_type: fast}   # paper Sec 2.6: fast judgment is used for high-throughput benchmark evaluation; empirically reproduces Table 4 (8B VLGuard 0.9536 vs paper 0.9511)

qwen3-vl-4b:
  <<: *defaults
  label: Qwen3-VL-4B
  adapter: generic_vlm_guard
  ms_id: Qwen/Qwen3-VL-4B-Instruct
  hf_id: Qwen/Qwen3-VL-4B-Instruct
  path: models/qwen3-vl-4b
  max_model_len: 32768
  gen: {temperature: 0.0, max_tokens: 512}
  chat_template_kwargs: {enable_thinking: false}

qwen3-vl-8b:
  <<: *defaults
  label: Qwen3-VL-8B
  adapter: generic_vlm_guard
  ms_id: Qwen/Qwen3-VL-8B-Instruct
  hf_id: Qwen/Qwen3-VL-8B-Instruct
  path: models/qwen3-vl-8b
  max_model_len: 32768
  gen: {temperature: 0.0, max_tokens: 512}
  chat_template_kwargs: {enable_thinking: false}

guardreasoner-vl-7b:
  <<: *defaults
  label: GuardReasoner-VL-7B
  adapter: guardreasoner
  hf_id: yueliu1999/GuardReasoner-VL-7B
  path: models/guardreasoner-vl-7b
  max_model_len: 32768
  gen: {temperature: 0.0, max_tokens: 2048}     # official card uses 4096; <think> is long
                                                # and truncation drops the <result> block

llavaguard-7b:
  <<: *defaults
  label: LlavaGuard
  adapter: llavaguard
  hf_id: AIML-TUDA/LlavaGuard-v1.0-7B-hf   # original release matching the paper citation; reachable via hf-mirror
  path: models/llavaguard-7b
  max_model_len: 4096                           # LLaVA-1.5 context limit
  gen: {temperature: 0.0, max_tokens: 256}


llavashield-v1-7b:
  <<: *defaults
  label: LLaVAShield
  adapter: llavashield
  hf_id: RealSafe/LLaVAShield-v1.0-7B   # exact version named in the paper (Table 10)
  # The released weights are a LLaVA-NeXT training-format checkpoint
  # (LlavaQwenForCausalLM, no auto_map) that neither vLLM nor transformers loads; we serve
  # the key-renamed conversion in models/llavashield-v1-7b-hf (scripts/convert_llavashield_hf.py).
  path: models/llavashield-v1-7b-hf
  # The checkpoint's own text config says max_position_embeddings=32768 (the 16K figure is
  # tokenizer_model_max_length, a tokenizer setting, not the model's context). 31% of MMDS-Q
  # prompts exceed 16384 and every one of them is Unsafe-labelled, so a 16K cap would suppress
  # exactly the unsafe recall this column measures.
  max_model_len: 32768
  gen: {temperature: 0.0, max_tokens: 1024}   # the rationale inside the JSON overruns 512

# ---------------------------------------------------------------- optional rows
# Available in the registry but not run by default. Fill path/ids and move into the enabled set
# once access is sorted out on the server.

safeguard-vl:
  <<: *defaults
  label: SafeGuard-VL
  adapter: safeguard_vl
  hf_id: tyodd/SafeGuard-VL-RL     # CVPR 2026 "Towards Policy-Adaptive Image Guardrail" (Qwen2.5-VL-7B + GRPO)
  path: models/safeguard-vl
  max_model_len: 32768
  gen: {temperature: 0.0, max_tokens: 512}

shieldgemma-2-4b:
  <<: *defaults
  label: ShieldGemma-2
  adapter: shieldgemma2-cls
  engine: classifier                       # ShieldGemma2ForImageClassification (SigLIP2+Gemma3-4B), image-only
  ms_id: google/shieldgemma-2-4b-it        # ModelScope mirror (hf-mirror returns 403 for this repo)
  hf_id: google/shieldgemma-2-4b-it
  path: models/shieldgemma-2-4b
  cls: {threshold: 0.5, batch_size: 8}

llama-guard3-vision-11b:
  <<: *defaults
  label: LlamaGuard3-Vision-11B
  adapter: llamaclassic
  ms_id: LLM-Research/Llama-Guard-3-11B-Vision   # Meta mirror on ModelScope (HF repo is gated)
  hf_id: meta-llama/Llama-Guard-3-11B-Vision
  path: models/llama-guard3-vision-11b
  max_model_len: 32768
  gen: {temperature: 0.0, max_tokens: 64}

llama-guard4-12b:
  <<: *defaults
  label: LlamaGuard4
  adapter: llamaclassic
  ms_id: LLM-Research/Llama-Guard-4-12B          # Meta mirror on ModelScope
  hf_id: meta-llama/Llama-Guard-4-12B
  path: models/llama-guard4-12b
  max_model_len: 32768
  gen: {temperature: 0.0, max_tokens: 64}

# ------------------------------------------------------------------ registry only
qwen3-vl-235b:
  <<: *defaults
  label: Qwen3-VL-235B
  # Needs 8 free GPUs on ONE node; not runnable on the currently available 4. Kept in the
  # registry so weights can be staged ahead of a window. See the `tp` note below.
  enabled: false
  adapter: generic_vlm_guard
  ms_id: Qwen/Qwen3-VL-235B-A22B-Instruct-FP8   # only quantised release; bf16 is 439 GiB
  hf_id: Qwen/Qwen3-VL-235B-A22B-Instruct-FP8
  path: models/qwen3-vl-235b-fp8
  max_model_len: 32768
  # 64 attention heads / 4 KV heads: vLLM needs the world size to divide the head count, so
  # TP=5 is not a legal size at all (64/5 is not an integer), and TP=4 x 48 GiB cannot hold
  # the 221 GiB of FP8 weights. 8 is the only working configuration.
  tp: 8
  gen: {temperature: 0.0, max_tokens: 512}
  chat_template_kwargs: {enable_thinking: false}
