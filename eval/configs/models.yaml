  path: models/qwen3-vl-4b
  max_model_len: 8192
  gen: {temperature: 0.0, max_tokens: 512}
  chat_template_kwargs: {enable_thinking: false}

qwen3-vl-8b:
  <<: *defaults
  label: Qwen3-VL-8B
  adapter: generic_vlm_guard
  ms_id: Qwen/Qwen3-VL-8B
  hf_id: Qwen/Qwen3-VL-8B
