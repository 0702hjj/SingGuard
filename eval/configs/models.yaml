# Model registry for Table 4 reproduction.
#
# Fields:
#   label               : row name in the reproduced table (aligned with configs/table4_paper.csv)
#   adapter             : prompt/parse strategy, see sgeval/adapters.py
#   engine              : vllm (default) or hf (transformers fallback)
#   ms_id / hf_id       : ModelScope id (CN direct) / HuggingFace id (via hf-mirror)
#   path                : local dir populated by scripts/download_models.py (relative to eval/)
#   gen                 : decoding args (greedy everywhere, matching the paper's protocol)
#   chat_template_kwargs: passed through vLLM `chat_template_kwargs` into apply_chat_template
#   max_model_len       : vLLM context length
#
# Baseline prompts are approximations: the paper does not release the exact prompts used for
# baseline rows (Appendix A only documents SingGuard's template). Each adapter follows the
# corresponding model card as closely as practical.

defaults: &defaults
  engine: vllm
  gpu_memory_utilization: 0.90
  gen: {temperature: 0.0}

# ---------------------------------------------------------------- enabled set
sing-guard-2b:
  <<: *defaults
  label: SingGuard-2B
  adapter: singguard
  ms_id: inclusionAI/Sing-Guard-2b
  hf_id: inclusionAI/Sing-Guard-2b
  path: models/sing-guard-2b
  max_model_len: 8192
  gen: {temperature: 0.0, max_tokens: 128}
  chat_template_kwargs: {thinking_type: fast}   # paper: fast mode for high-throughput benchmark evaluation

sing-guard-4b:
  <<: *defaults
  label: SingGuard-4B
  adapter: singguard
  ms_id: inclusionAI/Sing-Guard-4b
  hf_id: inclusionAI/Sing-Guard-4b
  path: models/sing-guard-4b
  max_model_len: 8192
  gen: {temperature: 0.0, max_tokens: 128}
  chat_template_kwargs: {thinking_type: fast}

sing-guard-8b:
  <<: *defaults
  label: SingGuard-8B
  adapter: singguard
  ms_id: inclusionAI/Sing-Guard-8b
  hf_id: inclusionAI/Sing-Guard-8b
