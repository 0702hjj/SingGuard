  label: GuardReasoner-VL-7B
  adapter: guardreasoner
  hf_id: yueliu1999/GuardReasoner-VL-7B
  path: models/guardreasoner-vl-7b
  max_model_len: 8192
  gen: {temperature: 0.0, max_tokens: 512}      # reasoning model: longer output, parse the final verdict

llavaguard-7b:
  <<: *defaults
  label: LlavaGuard
  adapter: llavaguard
  hf_id: AIML-Toulouse/LlavaGuard-7b
  path: models/llavaguard-7b
  max_model_len: 4096                           # LLaVA-1.5 context limit
  gen: {temperature: 0.0, max_tokens: 256}

# ---------------------------------------------------------------- optional rows
# Available in the registry but not run by default. Fill path/ids and move into the enabled set
# once access is sorted out on the server.

safeguard-vl:
  <<: *defaults
  enabled: false
  label: SafeGuard-VL
  adapter: generic_vlm_guard
  hf_id: TBD   # Piao et al. 2026 checkpoint id - verify before enabling
  path: models/safeguard-vl
  max_model_len: 8192
  gen: {temperature: 0.0, max_tokens: 512}

shieldgemma-2-4b:
